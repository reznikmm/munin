name: Build with Alire

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: alire-project/setup-alire@v6
    - name: Turn shared dependencies off
      run: alr settings --global --set dependencies.shared false
    - name: Build project
      run: alr build
    - uses: actions/upload-artifact@v4
      with:
        name: munin-linux-x86_64
        path: bin/munin
    - name: Build project and run tests
      run: alr test
    - name: Dump log
      if: ${{ failure() }}
      run: cat alire/alr_test_local.log

  check-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      match: ${{ steps.check.outputs.match }}
    steps:
    - id: check
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        if [[ "$tag" =~ ^[0-9.]+$ ]]; then
          echo "match=true" >> "$GITHUB_OUTPUT"
        else
          echo "match=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: check-tag
    if: needs.check-tag.outputs.match == 'true'
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          asset: munin-linux-x86_64
          exe: munin
        - os: macos-latest
          asset: munin-macos-x86_64
          exe: munin
        - os: windows-latest
          asset: munin-windows-x86_64.exe
          exe: munin.exe
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: alire-project/setup-alire@v6
    - name: Turn shared dependencies off
      run: alr settings --global --set dependencies.shared false
    - name: Build project
      run: alr build --release
    - name: Rename binary
      shell: bash
      run: cp bin/${{ matrix.exe }} ${{ matrix.asset }}
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: munin-*
        merge-multiple: true
    - uses: softprops/action-gh-release@v2
      with:
        files: dist/*
